name: upbit-listing-watcher

on:
  schedule:
    # 每 5 分钟运行一次（public 仓库免费不限量；private 仓库每月 2000 分钟会超额，见 README）
    - cron: '*/5 * * * *'
  workflow_dispatch:
    # 手动触发；勾选"发送测试邮件"可立即验证邮箱配置
    inputs:
      test_mail:
        description: '仅发送一封测试邮件（验证 SMTP 配置）'
        type: boolean
        default: false
      explore:
        description: '探测 Upbit 公告接口（调试用）'
        type: boolean
        default: false

permissions:
  contents: write   # 允许把 state.json 提交回仓库

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 诊断 secrets（不打印值，只看是否存在）
        run: |
          echo "GITHUB_REPOSITORY=$GITHUB_REPOSITORY"
          echo "GITHUB_ACTOR=$GITHUB_ACTOR"
          for s in SMTP_HOST SMTP_PORT SMTP_USER SMTP_PASS MAIL_TO; do
            v="$(printenv "$s" 2>/dev/null || true)"
            if [ -n "$v" ]; then echo "$s: 已设置（长度 ${#v}）"; else echo "$s: 未设置"; fi
          done
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '465' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}

      - name: Run watcher
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '465' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          TEST_MAIL: ${{ github.event.inputs.test_mail || 'false' }}
          UPBIT_EXPLORE: ${{ github.event.inputs.explore || 'false' }}
        run: python main.py

      - name: Commit state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "chore: update watcher state"
          git push
